syntax = "proto3";

option java_package = "com.xbaimiao.easyrpc.protocol";
option java_outer_classname = "EasyRpcProto";

// EasyRpc 外层传输帧。
//
// 业务参数不会直接展开成 proto 字段，而是由 Kotlin RpcCodec 编码后写入 payload。
// 这样 DSL 可以支持 String/Int/List/protobuf 等多种参数组合，同时保留统一的路由元数据。
message RpcFrame {
  // REQUEST / RESPONSE / ERROR / HELLO / CLIENTS_SYNC。
  FrameType type = 1;

  // 请求 ID。RESPONSE 和 ERROR 必须带回同一个 request_id。
  int64 request_id = 2;

  // 发送方节点 ID。例如 service、lobby-1、game-2。
  string source_node = 3;

  // 发送方节点类型。
  NodeKind source_kind = 4;

  // 目标路由。service 会根据它决定投递给谁。
  RpcTarget target = 5;

  // RPC group，对应 Kotlin RpcGroup.group。
  string group = 6;

  // RPC 方法名，对应 RpcGroup.rpc("name")。
  string method = 7;

  // 业务参数或返回值 payload，由 RpcCodec 负责解释。
  bytes payload = 8;

  // 错误分类。只有 ERROR frame 使用，例如 duplicate、not_found、internal_error。
  string error_classifier = 9;

  // 错误消息。只有 ERROR frame 使用。
  string error_message = 10;

  // 发送方 tags。HELLO 会用它声明 client tags，普通 frame 可作为来源元数据。
  repeated string source_tags = 11;

  // 在线 client 列表。只有 CLIENTS_SYNC frame 使用。
  repeated RpcClientInfo online_clients = 12;

  // 发送方显示名称。HELLO 会用它声明 client 显示名，普通 frame 可作为来源元数据。
  string source_display_name = 13;

  // 发送方自定义元数据。HELLO 会用它声明 client metadata，普通 frame 可作为来源元数据。
  map<string, string> source_metadata = 14;
}

// 路由目标。
message RpcTarget {
  TargetType type = 1;

  // TARGET_NODE 时使用，指定目标 nodeId。
  string node_id = 2;

  // TARGET_TAG 时使用，指定目标 tag。
  string tag = 3;
}

// 在线 client 元数据。
message RpcClientInfo {
  string node_id = 1;
  repeated string tags = 2;

  // 显示名称。client 没声明时 service 会回退成 node_id。
  string display_name = 3;

  // 自定义元数据，由 client 自己定义键值含义。
  map<string, string> metadata = 4;
}

enum FrameType {
  FRAME_UNKNOWN = 0;
  REQUEST = 1;
  RESPONSE = 2;
  ERROR = 3;
  HELLO = 4;
  CLIENTS_SYNC = 5;
}

enum TargetType {
  TARGET_SERVICE = 0;
  TARGET_NODE = 1;
  TARGET_ALL = 2;
  TARGET_ALL_CLIENTS = 3;
  TARGET_TAG = 4;
}

enum NodeKind {
  NODE_UNKNOWN = 0;
  SERVICE = 1;
  CLIENT = 2;
}
