name: EasyRpcClient
main: com.xbaimiao.easyrpc.plugin.EasyRpcClientPlugin
version: ${version}
author: xbaimiao
api-version: '1.18'
load: STARTUP
softdepend:
  - PlaceholderAPI
commands:
  easyrpc:
    description: EasyRpc 状态查询与重连
    usage: /easyrpc [status|reconnect|nodes]
    permission: easyrpc.admin
permissions:
  easyrpc.admin:
    description: 使用 /easyrpc 命令
    default: op
