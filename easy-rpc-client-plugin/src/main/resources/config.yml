host: 127.0.0.1
port: 29090

# 共享鉴权 token，必须和 service 的 easyrpc-service.yml 里的 auth-token 完全一致。
# service 首次启动时会随机生成一个，复制过来填在这里。
# 填错会被 service 拒绝并停止自动重连，改好之后执行 /easyrpc reconnect。
auth-token: ''

# 本节点唯一 ID，路由靠它，整个集群不能重复。
# 留空则使用服务器名。多个服务器共用同一个 node-id 会互相顶下线。
node-id: ''

# 显示名称，给人看的，留空则回退成 node-id。
# 例: display-name: '大厅一号'
display-name: ''

# 标签，可以用 RpcTarget.tag("xxx") 一次调用所有同 tag 的节点。
# 例:
# tags:
#   - lobby
#   - hub
tags: []

# 自定义元数据。键值含义完全由你自己约定，会随 HELLO 上报给 service，
# 再同步给所有 client；service 和其它 client 都能读到。
# 值统一按字符串处理，写数字或 true/false 也会转成字符串。
# 例:
# metadata:
#   version: '1.20.4'
#   region: cn-east
#   max-players: 200
metadata: {}

connect-on-enable: true

# 跨服控制台命令
remote-command:
  # 是否允许其它节点让本服执行控制台命令。
  # 默认关闭。打开等于把本服的完整控制权交给任何持有相同 auth-token 的节点，
  # 因为控制台命令里包含 op、stop 这种。只在你确实需要批量运维时打开。
  # 注意这个开关管的是「本服是否被别人操作」，不影响本服能不能操作别人。
  accept: true

  # 是否把命令输出回传给发起方。
  # 默认值：true。布尔值；true 使用 Paper 的命令反馈通道捕获，false 使用真实控制台且不回传输出。
  # 只捕获命令通过发送者返回的同步反馈；插件主动写入日志或异步线程稍后产生的内容不会回传。
  capture-output: true
